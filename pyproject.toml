[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-card-organizer"
version = "0.10.1"
description = "Cross-platform camera card monitor and verified media organizer"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "ExifRead>=3.0",
  "PySide6>=6.8,<7",
]

[project.scripts]
photo-card-organizer = "photocard.cli:main"

[tool.setuptools]
packages = ["photocard"]
