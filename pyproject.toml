[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-card-organizer"
version = "0.11.3.dev4"
description = "Import and organize photos and videos from camera cards and folders on Windows and Linux."
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "ExifRead>=3.0",
  "PySide6>=6.8,<7",
]

[project.scripts]
photo-card-organizer = "photocard.cli:main"

[tool.setuptools]
packages = ["photocard"]
